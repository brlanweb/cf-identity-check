<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10140f" />
    <meta name="color-scheme" content="dark" />
    <title>Claude AI 信任检查 · 出口 IP</title>
    <meta
      name="description"
      content="对照当前出口 IP 的 Claude AI 信任分、地区、属性、DNS、UDP、ASN 和设备信号。启发式，与 Anthropic 无关。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="top">
      <div class="top-copy">
        <p class="kicker">当前访问的出口 IP</p>
        <h1>Claude AI 信任检查</h1>
      </div>
      <div class="top-actions">
        <p class="pill">服务器不落库</p>
        <button type="button" id="rerun">重新测量</button>
      </div>
    </header>
    <main id="app">
      <p id="status" role="status">正在读取边缘与浏览器信号…</p>
      <div id="verdict"></div>
      <div id="details"></div>
      <div id="raw"></div>
    </main>
    <footer>
      <p>服务器不落库。Cookie 和 Authorization 不回传。会话次数只留在本标签页。</p>
      <p>信任分是启发式，与 Anthropic 无关。公网出口 IP 会向 StopForumSpam 查一次；查不到就显示无历史库。</p>
    </footer>
    <noscript>需要启用 JavaScript 才能测量时区、WebRTC 和指纹。</noscript>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
