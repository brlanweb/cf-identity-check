<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0f0c" />
    <meta name="color-scheme" content="dark" />
    <title>cf-identity-check · 访问信号核对</title>
    <meta
      name="description"
      content="伪装度、欺诈分，以及常见 AI 与地区限制服务的启发式状态。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="top">
      <div class="top-copy">
        <p class="kicker">cf-identity-check</p>
        <h1>访问信号核对</h1>
      </div>
      <div class="top-actions">
        <p class="pill">默认不落库</p>
        <button type="button" id="rerun">重新测量</button>
      </div>
    </header>
    <main id="app">
      <p id="status" role="status">正在读取边缘与浏览器信号…</p>
      <div id="verdict"></div>
      <div id="details"></div>
      <div id="raw"></div>
    </main>
    <footer>
      <p>不落库。Cookie 和 Authorization 不回传。WebRTC 使用公共 STUN，存储探测写完即删。</p>
      <p>分数和矩阵是启发式，不连接这些服务，也不是绕过地区限制的方法。</p>
      <p class="en">Nothing stored. Cookie and Authorization are dropped. Heuristic only, not a bypass.</p>
    </footer>
    <noscript>需要启用 JavaScript 才能在浏览器里测量屏幕、WebGL 和时区。</noscript>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
